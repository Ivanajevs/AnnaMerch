<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – St. Anna Merch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />



  <style>
    :root {
      --bg:        #fce7e7;
      --bg2:       #f8aaaa;
      --bg3:       #f58b8b;
      --gold:      #fd0000;
      --gold-dim:  #d44013;
      --text:      #000000;
      --text-muted:#880000;
      --radius:    10px;
      --green:     #22c55e;
      --red:       #ef4444;
      --border:    rgba(232,160,32,.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .logo-sub {
      font-size: .75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .admin-badge {
      margin-left: auto;
      font-size: .7rem;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      padding: .25rem .7rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    #logoutBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      padding: .4rem .9rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    #logoutBtn:hover { border-color: var(--gold); color: var(--gold); }

    /*  Login Screen*/
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 70px);
      padding: 2rem;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .login-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .login-card label {
      font-size: .78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      display: block;
      margin-bottom: .4rem;
    }
    .login-card input {
      width: 100%;
      padding: .7rem 1rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--gold); }
    .login-error {
      font-size: .83rem;
      color: var(--red);
      min-height: 1.2rem;
    }
    .btn-login {
      width: 100%;
      padding: .8rem;
      background: var(--gold);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .06em;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-login:hover { background: var(--gold-dim); }

    /*  Dashboard  */
    #dashboard {
      display: none;
      padding: 2rem;
    }
    .dash-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .order-count { font-size: .8rem; color: var(--text-muted); }
    .btn-refresh {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      padding: .4rem .9rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    thead th {
      background: var(--bg3);
      color: var(--text-muted);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 600;
      padding: .85rem 1.1rem;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid rgba(232,160,32,.07); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(232,160,32,.04); }
    tbody td { padding: .85rem 1.1rem; vertical-align: middle; white-space: nowrap; }
    .order-id-btn {
      background: none;
      border: none;
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 0;
    }
    .order-id-btn:hover { color: var(--gold-dim); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .3rem .8rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      border: none;
      transition: all .2s;
    }
    .status-badge.on  { background: rgba(34,197,94,.18); color: var(--green); }
    .status-badge.off { background: rgba(239,68,68,.12); color: var(--red); }
    .status-badge:hover { filter: brightness(1.1); transform: scale(1.05); }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .table-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .date-cell { font-size: .8rem; color: var(--text-muted); }

    /* Detail Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(88,14,24,.7);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .detail-modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 520px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      padding: 2rem;
      position: relative;
      transform: translateY(20px) scale(.97);
      transition: transform .3s cubic-bezier(.34,1.3,.64,1);
    }
    .modal-overlay.active .detail-modal { transform: translateY(0) scale(1); }
    .detail-close {
      position: absolute; top: 1rem; right: 1.2rem;
      background: none; border: none; font-size: 1.3rem;
      cursor: pointer; color: var(--text-muted);
    }
    .detail-close:hover { color: var(--gold); }
    .detail-modal h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; color: var(--gold);
      letter-spacing: .04em; margin-bottom: 1.2rem;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .7rem 1.2rem;
    }
    .detail-item { display: flex; flex-direction: column; gap: .15rem; }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-label {
      font-size: .68rem; text-transform: uppercase;
      letter-spacing: .12em; color: var(--text-muted); font-weight: 600;
    }
    .detail-value { font-size: .9rem; color: var(--text); word-break: break-all; }
    .detail-divider { grid-column: 1/-1; border: none; border-top: 1px solid var(--border); margin: .3rem 0; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo-main">St. Anna</div>
      <div class="logo-sub">Admin-Panel</div>
    </div>
    <span class="admin-badge">Admin</span>
    <button id="logoutBtn" hidden>Abmelden</button>
  </header>

  <!--Login  -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Anmelden</h2>
      <div>
        <label for="loginUser">Benutzername</label>
        <input type="text" id="loginUser" autocomplete="username" placeholder="admin" />
      </div>
      <div>
        <label for="loginPass">Passwort</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <p class="login-error" id="loginError"></p>
      <button class="btn-login" id="loginBtn">Anmelden</button>
    </div>
  </div>

  <!--  Dashboard  -->
  <div id="dashboard">
    <div class="dash-header">
      <h1>Bestellungen</h1>
      <span class="order-count" id="orderCount"></span>
      <button class="btn-refresh" id="refreshBtn">↻ Aktualisieren</button>
    </div>
    <div class="table-wrap">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Bestell-ID</th>
            <th>Produkt</th>
            <th>Kunde</th>
            <th>Bezahlt</th>
            <th>Bestellt</th>
            <th>Ausgeliefert</th>
            <th>Datum</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="7" class="table-state">Lade Bestellungen…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!--Detail Modal -->
  <div class="modal-overlay" id="detailOverlay">
    <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="detail-close" id="detailClose" aria-label="Schließen">✕</button>
      <h3 id="detailTitle">Bestellung</h3>
      <div class="detail-grid" id="detailGrid"></div>
    </div>
  </div>

  <script>
  
 
  let authHeader = null;   // Base64-kodiert, wird beim Login gesetzt
  let isLoggedIn = false;

  /*  LOGIN  */
  async function attemptLogin() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;
    const err  = document.getElementById("loginError");

    if (!user || !pass) {
      err.textContent = "Bitte Benutzername und Passwort eingeben.";
      return;
    }

    err.textContent = "Prüfe Zugangsdaten…";

    // Anmeldedaten als Base64-Header vorbereiten (HTTP Basic Auth)
    const encoded = btoa(`${user}:${pass}`);
    const testHeader = `Basic ${encoded}`;

    // Einen  Server-Request machen um die Credentials zu prüfen
    const res = await fetch("/api/admin?action=orders", {
      headers: { "Authorization": testHeader },
    });

    if (res.status === 401) {
      err.textContent = "Falscher Benutzername oder falsches Passwort.";
      document.getElementById("loginPass").value = "";
      authHeader = null;
      return;
    }

    if (!res.ok) {
      err.textContent = "Serverfehler. Bitte versuche es später.";
      return;
    }

    //  eingeloggt
    authHeader = testHeader;
    isLoggedIn = true;
    err.textContent = "";

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display   = "block";
    document.getElementById("logoutBtn").hidden = false;

    const data = await res.json();
    renderOrders(data);
  }

  document.getElementById("loginBtn").addEventListener("click", attemptLogin);
  document.getElementById("loginPass").addEventListener("keydown", e => {
    if (e.key === "Enter") attemptLogin();
  });
  document.getElementById("loginUser").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("loginPass").focus();
  });

  /* Logout  */
  document.getElementById("logoutBtn").addEventListener("click", () => {
    authHeader = null;
    isLoggedIn = false;
    document.getElementById("loginScreen").style.display = "";
    document.getElementById("dashboard").style.display   = "none";
    document.getElementById("logoutBtn").hidden = true;
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
    document.getElementById("loginError").textContent = "";
  });

  /*  BESTELLUNGEN LADEN */
  async function loadOrders() {
    const tbody = document.getElementById("ordersBody");
    tbody.innerHTML = `<tr><td colspan="7" class="table-state">Lade Bestellungen…</td></tr>`;

    const res = await fetch("/api/admin?action=orders", {
      headers: { "Authorization": authHeader },
    });

    if (!res.ok) {
      tbody.innerHTML = `<tr><td colspan="7" class="table-state" style="color:var(--red)">
        Fehler beim Laden (${res.status})</td></tr>`;
      return;
    }

    const data = await res.json();
    renderOrders(data);
  }

  document.getElementById("refreshBtn").addEventListener("click", loadOrders);

  /* TABELLE  */
  function renderOrders(data) {
    const tbody = document.getElementById("ordersBody");
    tbody.innerHTML = "";

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="table-state">Noch keine Bestellungen vorhanden.</td></tr>`;
      document.getElementById("orderCount").textContent = "";
      return;
    }

    document.getElementById("orderCount").textContent =
      `${data.length} Bestellung${data.length !== 1 ? "en" : ""}`;

    data.forEach(order => {
      const tr = document.createElement("tr");
      const dateStr = order.created_at
        ? new Date(order.created_at).toLocaleString("de-DE", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit"
          })
        : "—";

      tr.innerHTML = `
        <td>
          <button class="order-id-btn" data-id="${order.id}">
            ${order.order_id || order.id.substring(0, 8) + "…"}
          </button>
        </td>
        <td>${order.product_name || "—"}</td>
        <td>${order.customer_name || "—"}</td>
        <td>${statusBadge("paid",      order.id, order.paid)}</td>
        <td>${statusBadge("ordered",   order.id, order.ordered)}</td>
        <td>${statusBadge("delivered", order.id, order.delivered)}</td>
        <td class="date-cell">${dateStr}</td>
      `;

      tr.querySelector(".order-id-btn").addEventListener("click", () => openDetail(order));

      tr.querySelectorAll(".status-badge").forEach(badge => {
        badge.addEventListener("click", () => toggleStatus(badge, order));
      });

      tbody.appendChild(tr);
    });
  }

  /* STATUS */
  function statusBadge(field, orderId, value) {
    const on = !!value;
    return `<button class="status-badge ${on ? "on" : "off"}"
               data-field="${field}" data-order-id="${orderId}">
               <span class="status-dot"></span>
               ${on ? "Ja" : "Nein"}
            </button>`;
  }

  
  async function toggleStatus(badge, order) {
    const field    = badge.dataset.field;
    const newValue = badge.classList.contains("on") ? false : true;

    badge.classList.toggle("on",  newValue);
    badge.classList.toggle("off", !newValue);
    badge.innerHTML = `<span class="status-dot"></span>${newValue ? "Ja" : "Nein"}`;

    // An Server senden
    const res = await fetch("/api/admin?action=status", {
      method: "PATCH",
      headers: {
        "Authorization": authHeader,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ id: order.id, field, value: newValue }),
    });

    if (!res.ok) {
      // Rollback
      badge.classList.toggle("on",  !newValue);
      badge.classList.toggle("off", newValue);
      badge.innerHTML = `<span class="status-dot"></span>${!newValue ? "Ja" : "Nein"}`;
      alert("Fehler beim Speichern: " + res.status);
    }

    order[field] = newValue;
  }

  /* DETAIL MODAL  */
  function openDetail(order) {
    document.getElementById("detailTitle").textContent =
      `Bestellung ${order.order_id || "—"}`;

    const grid = document.getElementById("detailGrid");
    const rows = [
      { label: "Bestell-ID",   value: order.order_id || "—" },
      { label: "Datum",        value: order.created_at ? new Date(order.created_at).toLocaleString("de-DE") : "—" },
      { label: "divider" },
      { label: "Produkt",      value: order.product_name  || "—" },
      { label: "Preis",        value: order.product_price || "—" },
      { label: "Größe",        value: order.size          || "—" },
      { label: "Farbe",        value: order.color         || "—" },
      { label: "Geschlecht",   value: order.gender        || "—" },
      { label: "Klasse",       value: `${order.class_level || ""}${order.class_letter || ""}` || "—" },
      { label: "divider" },
      { label: "Name",         value: order.customer_name  || "—" },
      { label: "E-Mail",       value: order.customer_email || "—", full: true },
      { label: "Anmerkung",    value: order.note           || "—", full: true },
      { label: "divider" },
      { label: "Bezahlt",      value: order.paid      ? "✓ Ja" : "✗ Nein" },
      { label: "Bestellt",     value: order.ordered   ? "✓ Ja" : "✗ Nein" },
      { label: "Ausgeliefert", value: order.delivered ? "✓ Ja" : "✗ Nein" },
    ];

    grid.innerHTML = rows.map(r => {
      if (r.label === "divider") return `<hr class="detail-divider" />`;
      return `
        <div class="detail-item${r.full ? " full" : ""}">
          <span class="detail-label">${r.label}</span>
          <span class="detail-value">${r.value}</span>
        </div>`;
    }).join("");

    document.getElementById("detailOverlay").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeDetail() {
    document.getElementById("detailOverlay").classList.remove("active");
    document.body.style.overflow = "";
  }

  document.getElementById("detailClose").addEventListener("click", closeDetail);
  document.getElementById("detailOverlay").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeDetail();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeDetail();
  });
  </script>
</body>
</html>
